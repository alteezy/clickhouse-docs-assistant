volumes:
  qdrant_storage:
    driver: local
  postgres_data:
    driver: local

services:
  qdrant:
    image: qdrant/qdrant:v1.19.0
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    restart: unless-stopped

  postgres:
    image: postgres:18
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    environment:
      POSTGRES_DB: monitoring
      POSTGRES_USER: monitoring
      POSTGRES_PASSWORD: monitoring
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d $${POSTGRES_DB} -U $${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  app:
    build: .
    ports:
      - "8501:8501"
    environment:
      QDRANT_URL: http://qdrant:6333
      DATABASE_URL: postgresql://monitoring:monitoring@postgres:5432/monitoring
      GROQ_API_KEY: ${GROQ_API_KEY}
    depends_on:
      qdrant:
        condition: service_started
      postgres:
        condition: service_healthy
    restart: unless-stopped

  dashboard:
    build: .
    command: ["streamlit", "run", "monitoring/dashboard.py", "--server.address=0.0.0.0", "--server.port=8502"]
    ports:
      - "8502:8502"
    environment:
      DATABASE_URL: postgresql://monitoring:monitoring@postgres:5432/monitoring
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
